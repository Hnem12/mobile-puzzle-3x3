services:
  server:
    build: ./server
    restart: unless-stopped
    env_file: ./server/.env.example

    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads

  client:
    build: ./client
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  uploads:
