services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build: ./server
    restart: unless-stopped
    env_file: ./server/.env.example
    environment:
      MONGO_URI: mongodb://mongo:27017/mobile-puzzle-3x3
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      - mongo

  client:
    build: ./client
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo_data:
  uploads:
